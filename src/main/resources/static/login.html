<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация – Тайм-менеджер</title>
    <style>
        /* ----- Переменные (единый стиль) ----- */
        :root {
            --bg-body: #f5f7fa;
            --bg-card: #ffffff;
            --bg-input: #f0f2f5;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-hover: 0 8px 24px rgba(0,0,0,0.1);
            --primary: #1976d2;
            --primary-light: #e3f0ff;
            --danger: #ef4444;
            --success: #22c55e;
            --radius: 16px;
            --transition: 0.25s ease;
        }

        body.dark {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --bg-input: #2d2d2d;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #334155;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-hover: 0 8px 24px rgba(0,0,0,0.5);
            --primary-light: #1a2a4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ----- Карточка ----- */
        .auth-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-hover);
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            transition: background var(--transition), box-shadow var(--transition);
        }

        .auth-card .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .auth-card .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .auth-card .field {
            margin-bottom: 18px;
        }

        .auth-card .field label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .auth-card .field input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border var(--transition), background var(--transition);
        }

        .auth-card .field input:focus {
            border-color: var(--primary);
        }

        .auth-card .btn-primary {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 30px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background var(--transition);
        }

        .auth-card .btn-primary:hover {
            background: #1565c0;
        }

        .auth-card .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-card .error-msg {
            color: var(--danger);
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
        }

        .auth-card .footer-links {
            display: flex;
            justify-content: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-secondary);
            gap: 8px;
        }

        .auth-card .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color var(--transition);
            cursor: pointer;
        }

        .auth-card .footer-links a:hover {
            color: #1565c0;
            text-decoration: underline;
        }

        .auth-card .form-container {
            display: block;
        }

        .auth-card .form-container.hidden {
            display: none;
        }

        /* ----- Кнопка темы ----- */
        .theme-toggle-wrapper {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 100;
        }

        .theme-toggle-wrapper button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-primary);
            transition: background var(--transition), border var(--transition);
            box-shadow: var(--shadow);
        }

        .theme-toggle-wrapper button:hover {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        /* ----- Адаптив ----- */
        @media (max-width: 480px) {
            .auth-card {
                padding: 28px 20px;
            }
            .auth-card .logo {
                font-size: 28px;
            }
            .theme-toggle-wrapper {
                top: 12px;
                right: 12px;
            }
            .theme-toggle-wrapper button {
                padding: 6px 12px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
<!-- Кнопка переключения темы -->
<div class="theme-toggle-wrapper">
    <button id="themeToggle" title="Переключить тему">🌙</button>
</div>

<!-- Карточка -->
<div class="auth-card">
    <div class="logo">⏳ TaskFlow</div>
    <div class="subtitle" id="formSubtitle">Войдите в свой аккаунт</div>

    <!-- Форма входа -->
    <div class="form-container" id="loginFormContainer">
        <form id="loginForm">
            <div class="field">
                <label for="loginUsername">Логин</label>
                <input type="text" id="loginUsername" placeholder="Введите логин" required autofocus>
            </div>
            <div class="field">
                <label for="loginPassword">Пароль</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">Войти</button>
            <div class="error-msg" id="loginError"></div>
        </form>
        <div class="footer-links">
            <a href="#" id="forgotLink">Забыли пароль?</a>
            <a href="#" id="switchToRegister">Регистрация</a>
        </div>
    </div>

    <!-- Форма регистрации -->
    <div class="form-container hidden" id="registerFormContainer">
        <form id="registerForm">
            <div class="field">
                <label for="regUsername">Логин</label>
                <input type="text" id="regUsername" placeholder="Придумайте логин" required>
            </div>
            <div class="field">
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail" placeholder="example@mail.com" required>
            </div>
            <div class="field">
                <label for="regPassword">Пароль</label>
                <input type="password" id="regPassword" placeholder="минимум 6 символов" required minlength="6">
            </div>
            <div class="field">
                <label for="regPasswordConfirm">Подтверждение пароля</label>
                <input type="password" id="regPasswordConfirm" placeholder="повторите пароль" required>
            </div>
            <button type="submit" class="btn-primary" id="registerBtn">Зарегистрироваться</button>
            <div class="error-msg" id="registerError"></div>
        </form>
        <div class="footer-links">
            <a href="#" id="switchToLogin">Уже есть аккаунт? Войти</a>
        </div>
    </div>
</div>

<script>
    (function() {
        // ----- Тема -----
        const body = document.body;
        const themeToggle = document.getElementById('themeToggle');

        function applyTheme(theme) {
            if (theme === 'dark') {
                body.classList.add('dark');
                themeToggle.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else if (theme === 'light') {
                body.classList.remove('dark');
                themeToggle.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            } else { // system
                localStorage.removeItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) {
                    body.classList.add('dark');
                    themeToggle.textContent = '☀️';
                } else {
                    body.classList.remove('dark');
                    themeToggle.textContent = '🌙';
                }
            }
        }

        const savedTheme = localStorage.getItem('theme');
        applyTheme(savedTheme || 'system');

        themeToggle.addEventListener('click', () => {
            const current = localStorage.getItem('theme') || 'system';
            if (current === 'light') applyTheme('dark');
            else if (current === 'dark') applyTheme('system');
            else applyTheme('light');
        });

        // ----- Переключение форм -----
        const loginContainer = document.getElementById('loginFormContainer');
        const registerContainer = document.getElementById('registerFormContainer');
        const subtitle = document.getElementById('formSubtitle');
        const switchToRegister = document.getElementById('switchToRegister');
        const switchToLogin = document.getElementById('switchToLogin');

        function showLoginForm() {
            loginContainer.classList.remove('hidden');
            registerContainer.classList.add('hidden');
            subtitle.textContent = 'Войдите в свой аккаунт';
            // очищаем ошибки
            document.getElementById('loginError').textContent = '';
            document.getElementById('registerError').textContent = '';
        }

        function showRegisterForm() {
            registerContainer.classList.remove('hidden');
            loginContainer.classList.add('hidden');
            subtitle.textContent = 'Создайте новый аккаунт';
            document.getElementById('loginError').textContent = '';
            document.getElementById('registerError').textContent = '';
        }

        switchToRegister.addEventListener('click', (e) => {
            e.preventDefault();
            showRegisterForm();
        });

        switchToLogin.addEventListener('click', (e) => {
            e.preventDefault();
            showLoginForm();
        });

        // ----- Обработка входа -----
        const loginForm = document.getElementById('loginForm');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.textContent = '';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Вход...';

            const username = loginUsername.value.trim();
            const password = loginPassword.value.trim();

            if (!username || !password) {
                loginError.textContent = 'Заполните все поля';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Войти';
                return;
            }

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })   // отправляем username вместо email
                });

                if (!response.ok) {
                    let errMsg = 'Неверный логин или пароль';
                    try {
                        const errData = await response.json();
                        if (errData.message) errMsg = errData.message;
                    } catch (_) {}
                    loginError.textContent = errMsg;
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Войти';
                    return;
                }

                const data = await response.json();
                if (data.token) {
                    localStorage.setItem('jwtToken', data.token);
                    window.location.href = '/tasks.html';
                } else {
                    loginError.textContent = 'Ошибка: токен не получен';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Войти';
                }
            } catch (err) {
                loginError.textContent = 'Ошибка соединения с сервером';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Войти';
            }
        });

        // ----- Обработка регистрации -----
        const registerForm = document.getElementById('registerForm');
        const regUsername = document.getElementById('regUsername');
        const regEmail = document.getElementById('regEmail');
        const regPassword = document.getElementById('regPassword');
        const regPasswordConfirm = document.getElementById('regPasswordConfirm');
        const registerBtn = document.getElementById('registerBtn');
        const registerError = document.getElementById('registerError');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            registerError.textContent = '';
            registerBtn.disabled = true;
            registerBtn.textContent = 'Регистрация...';

            const username = regUsername.value.trim();
            const email = regEmail.value.trim();
            const password = regPassword.value;
            const confirm = regPasswordConfirm.value;

            if (!username || !email || !password || !confirm) {
                registerError.textContent = 'Заполните все поля';
                registerBtn.disabled = false;
                registerBtn.textContent = 'Зарегистрироваться';
                return;
            }

            if (password.length < 6) {
                registerError.textContent = 'Пароль должен быть не менее 6 символов';
                registerBtn.disabled = false;
                registerBtn.textContent = 'Зарегистрироваться';
                return;
            }

            if (password !== confirm) {
                registerError.textContent = 'Пароли не совпадают';
                registerBtn.disabled = false;
                registerBtn.textContent = 'Зарегистрироваться';
                return;
            }

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })  // username вместо name
                });

                if (!response.ok) {
                    let errMsg = 'Ошибка регистрации';
                    try {
                        const errData = await response.json();
                        if (errData.message) errMsg = errData.message;
                    } catch (_) {}
                    registerError.textContent = errMsg;
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Зарегистрироваться';
                    return;
                }

                const data = await response.json();
                if (data.token) {
                    localStorage.setItem('jwtToken', data.token);
                    window.location.href = '/tasks.html';
                } else {
                    showLoginForm();
                    document.getElementById('loginError').textContent = 'Регистрация успешна! Войдите с новыми данными.';
                }
            } catch (err) {
                registerError.textContent = 'Ошибка соединения с сервером';
                registerBtn.disabled = false;
                registerBtn.textContent = 'Зарегистрироваться';
            }
        });

        // ----- Забыли пароль (заглушка) -----
        document.getElementById('forgotLink').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Восстановление пароля будет доступно позже.');
        });

        // Если на странице есть параметр ?register, можно сразу показать форму регистрации
        if (window.location.search.includes('register')) {
            showRegisterForm();
        }
    })();
</script>
</body>
</html>
