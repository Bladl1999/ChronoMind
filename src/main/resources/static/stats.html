<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="Статистика продуктивности ежедневника">
    <meta name="theme-color" content="#667eea">
    <title>📊 Статистика | Мой Ежедневник</title>
    <!-- Шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Chart.js для графиков -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-color: #667eea;
            --primary-dark: #5a67d8;
            --secondary-color: #764ba2;
            --success-color: #4caf50;
            --success-light: #e8f5e8;
            --warning-color: #ff9800;
            --warning-light: #fff3e0;
            --danger-color: #f44336;
            --danger-light: #ffebee;
            --text-primary: #333;
            --text-secondary: #666;
            --text-light: #888;
            --border-color: #e0e0e0;
            --border-light: #f0f0f0;
            --bg-light: #f5f5f5;
            --bg-white: #ffffff;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.3);
            --border-radius-sm: 8px;
            --border-radius-md: 12px;
            --border-radius-lg: 16px;
            --border-radius-xl: 20px;
            --border-radius-2xl: 24px;
            --transition-fast: 0.2s ease;
            --transition-base: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
            line-height: 1.5;
        }

        /* Скроллбар */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--border-light);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-gradient);
            border-radius: 10px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Шапка */
        .header {
            background: var(--bg-white);
            border-radius: var(--border-radius-xl);
            padding: 16px 28px;
            margin-bottom: 28px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-secondary);
            background: var(--bg-light);
            border: none;
            font-family: inherit;
            transition: var(--transition-base);
        }

        .back-btn:hover {
            background: #e1e8ff;
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .date-range {
            padding: 10px 16px;
            border-radius: 40px;
            border: 2px solid var(--border-color);
            font-size: 0.9rem;
            font-family: inherit;
            background: var(--bg-white);
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .date-range:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .refresh-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            transition: var(--transition-base);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.4);
        }

        /* Сетка карточек */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--bg-white);
            border-radius: var(--border-radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-md);
            transition: var(--transition-base);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary-gradient);
            opacity: 0.05;
            transform: translate(25%, -25%);
        }

        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: var(--border-radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            flex-shrink: 0;
        }

        .stat-icon.total {
            background: #e8f0fe;
            color: var(--primary-color);
        }
        .stat-icon.completed {
            background: var(--success-light);
            color: var(--success-color);
        }
        .stat-icon.avg-time {
            background: #fff8e1;
            color: #ff8f00;
        }
        .stat-icon.streak {
            background: #fce4ec;
            color: #e91e63;
        }

        .stat-info {
            flex: 1;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* Основной контент */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 28px;
        }

        .card {
            background: var(--bg-white);
            border-radius: var(--border-radius-xl);
            padding: 28px;
            box-shadow: var(--shadow-md);
            transition: var(--transition-base);
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-light);
        }

        /* График */
        .chart-container {
            position: relative;
            width: 100%;
            height: 300px;
        }

        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* Распределение приоритетов */
        .priority-bars {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .priority-bar-item {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .priority-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .priority-color.high {
            background: var(--danger-color);
        }
        .priority-color.medium {
            background: var(--warning-color);
        }
        .priority-color.low {
            background: var(--success-color);
        }

        .priority-info {
            flex: 1;
        }

        .priority-name {
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .priority-bar-bg {
            height: 10px;
            background: var(--border-light);
            border-radius: 10px;
            overflow: hidden;
        }

        .priority-bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.6s ease;
        }

        .priority-bar-fill.high {
            background: var(--danger-color);
        }
        .priority-bar-fill.medium {
            background: var(--warning-color);
        }
        .priority-bar-fill.low {
            background: var(--success-color);
        }

        .priority-count {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
            min-width: 50px;
            text-align: right;
        }

        /* Таблица последних записей */
        .table-wrapper {
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
            border-radius: var(--border-radius-md);
            border: 1px solid var(--border-light);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .data-table th {
            background: var(--bg-light);
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            position: sticky;
            top: 0;
            border-bottom: 2px solid var(--border-color);
        }

        .data-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
        }

        .data-table tr:hover td {
            background: #f8f9ff;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-high {
            background: var(--danger-light);
            color: var(--danger-color);
        }
        .badge-medium {
            background: var(--warning-light);
            color: var(--warning-color);
        }
        .badge-low {
            background: var(--success-light);
            color: var(--success-color);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        /* Адаптив */
        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-left {
                flex-direction: column;
                align-items: stretch;
            }
            .header-actions {
                flex-direction: column;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .chart-container {
                height: 250px;
            }
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .back-btn,
            .refresh-btn,
            .date-range {
                display: none;
            }
            .card {
                box-shadow: none;
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Шапка -->
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="back-btn" aria-label="Вернуться в ежедневник">
                <span aria-hidden="true">←</span>
                <span>Назад к записям</span>
            </a>
            <div class="header-title">
                <span aria-hidden="true">📊</span>
                <span>Статистика продуктивности</span>
            </div>
        </div>
        <div class="header-actions">
            <input type="month" id="monthFilter" class="date-range" aria-label="Фильтр по месяцу">
            <button class="refresh-btn" onclick="loadStats()" aria-label="Обновить статистику">
                <span aria-hidden="true">🔄</span>
                <span>Обновить</span>
            </button>
        </div>
    </header>

    <!-- Ключевые метрики -->
    <div class="stats-grid" id="metricsGrid">
        <!-- Заполняется динамически -->
    </div>

    <!-- Графики и распределение -->
    <div class="main-grid">
        <!-- График по дням недели -->
        <div class="card">
            <div class="card-header">
                <span aria-hidden="true">📅</span>
                <span>Активность по дням недели</span>
            </div>
            <div class="chart-container">
                <canvas id="weeklyChart" aria-label="График активности по дням недели" role="img"></canvas>
            </div>
            <div id="weeklyFallback" style="display: none;" class="empty-state">
                <div class="empty-icon">📭</div>
                <p>Нет данных для отображения</p>
            </div>
        </div>

        <!-- Распределение приоритетов -->
        <div class="card">
            <div class="card-header">
                <span aria-hidden="true">🎯</span>
                <span>Распределение приоритетов</span>
            </div>
            <div class="priority-bars" id="priorityBars">
                <!-- Заполняется динамически -->
            </div>
            <div id="priorityFallback" style="display: none;" class="empty-state">
                <div class="empty-icon">📭</div>
                <p>Нет данных о приоритетах</p>
            </div>
        </div>
    </div>

    <!-- Таблица последних записей -->
    <div class="card">
        <div class="card-header">
            <span aria-hidden="true">📋</span>
            <span>Последние записи (отфильтрованные)</span>
        </div>
        <div class="table-wrapper" id="tableWrapper">
            <table class="data-table" id="entriesTable">
                <thead>
                <tr>
                    <th>Дата</th>
                    <th>Время</th>
                    <th>Задача</th>
                    <th>Приоритет</th>
                    <th>Длительность</th>
                </tr>
                </thead>
                <tbody id="tableBody">
                <!-- Заполняется динамически -->
                </tbody>
            </table>
        </div>
        <div id="tableFallback" style="display: none;" class="empty-state">
            <div class="empty-icon">📭</div>
            <p>Записей не найдено. Создайте их на главной странице!</p>
        </div>
    </div>
</div>

<script>
    (function() {
        // Ключ localStorage (соответствует ключу в вашем основном приложении)
        const STORAGE_KEY = 'diary_entries';

        // Загружаем данные
        function getEntries() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                console.error('Ошибка чтения данных:', e);
                return [];
            }
        }

        // Форматирование времени (минуты -> часы и минуты)
        function formatDuration(minutes) {
            if (!minutes || minutes <= 0) return '—';
            const h = Math.floor(minutes / 60);
            const m = minutes % 60;
            if (h > 0 && m > 0) return `${h} ч ${m} мин`;
            if (h > 0) return `${h} ч`;
            return `${m} мин`;
        }

        // Вычисление длительности задачи в минутах
        function calcDuration(entry) {
            if (!entry.startTime || !entry.endTime) return null;
            const [sh, sm] = entry.startTime.split(':').map(Number);
            const [eh, em] = entry.endTime.split(':').map(Number);
            let mins = (eh * 60 + em) - (sh * 60 + sm);
            if (mins < 0) mins += 24 * 60; // переход через полночь
            return mins;
        }

        // Фильтр по месяцу
        function filterByMonth(entries, monthStr) {
            if (!monthStr) return entries;
            // monthStr в формате YYYY-MM
            return entries.filter(e => e.date && e.date.startsWith(monthStr));
        }

        // Получение дня недели (0 = Вс, 1 = Пн, ..., 6 = Сб)
        function getDayOfWeek(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.getDay(); // 0-6
        }

        const dayNames = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
        const dayNamesShort = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

        // Главная функция отрисовки
        function loadStats() {
            const monthFilter = document.getElementById('monthFilter').value;
            const allEntries = getEntries();
            const entries = filterByMonth(allEntries, monthFilter);

            // ====== КЛЮЧЕВЫЕ МЕТРИКИ ======
            const totalTasks = entries.length;
            const totalDuration = entries.reduce((sum, e) => sum + (calcDuration(e) || 0), 0);
            const avgDuration = totalTasks > 0 ? Math.round(totalDuration / totalTasks) : 0;

            // Продуктивная серия (дни подряд с хотя бы одной задачей)
            const datesSet = new Set(entries.map(e => e.date).filter(Boolean));
            const sortedDates = Array.from(datesSet).sort();
            let streak = 0;
            let maxStreak = 0;
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];

            for (let i = 0; i < sortedDates.length; i++) {
                const current = new Date(sortedDates[i] + 'T00:00:00');
                if (i === 0) {
                    streak = 1;
                } else {
                    const prev = new Date(sortedDates[i - 1] + 'T00:00:00');
                    const diffDays = Math.round((current - prev) / (1000 * 60 * 60 * 24));
                    if (diffDays === 1) {
                        streak++;
                    } else {
                        streak = 1;
                    }
                }
                if (streak > maxStreak) maxStreak = streak;
            }
            // Проверяем, продолжается ли серия сегодня
            const isTodayActive = datesSet.has(todayStr);
            const yesterdayStr = new Date(today.getTime() - 86400000).toISOString().split('T')[0];
            const isYesterdayActive = datesSet.has(yesterdayStr);

            let displayStreak = maxStreak;
            let streakLabel = 'Макс. серия';

            // Обновляем метрики в DOM
            document.getElementById('metricsGrid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-icon total">📋</div>
                    <div class="stat-info">
                        <div class="stat-value">${totalTasks}</div>
                        <div class="stat-label">Всего задач</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon completed">⏱️</div>
                    <div class="stat-info">
                        <div class="stat-value">${formatDuration(totalDuration)}</div>
                        <div class="stat-label">Общее время</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon avg-time">📊</div>
                    <div class="stat-info">
                        <div class="stat-value">${formatDuration(avgDuration)}</div>
                        <div class="stat-label">Среднее время на задачу</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon streak">🔥</div>
                    <div class="stat-info">
                        <div class="stat-value">${displayStreak} дн.</div>
                        <div class="stat-label">${streakLabel}</div>
                    </div>
                </div>
            `;

            // ====== ГРАФИК ПО ДНЯМ НЕДЕЛИ ======
            const dayCounts = new Array(7).fill(0);
            const dayDurations = new Array(7).fill(0);
            entries.forEach(e => {
                if (e.date) {
                    const dow = getDayOfWeek(e.date);
                    dayCounts[dow]++;
                    dayDurations[dow] += (calcDuration(e) || 0);
                }
            });

            const weeklyCanvas = document.getElementById('weeklyChart');
            const weeklyFallback = document.getElementById('weeklyFallback');
            let weeklyChartInstance = null;

            if (totalTasks === 0) {
                weeklyCanvas.style.display = 'none';
                weeklyFallback.style.display = 'block';
            } else {
                weeklyCanvas.style.display = 'block';
                weeklyFallback.style.display = 'none';

                if (window.weeklyChartInstance) {
                    window.weeklyChartInstance.destroy();
                }

                window.weeklyChartInstance = new Chart(weeklyCanvas, {
                    type: 'bar',
                    data: {
                        labels: dayNames,
                        datasets: [{
                            label: 'Количество задач',
                            data: dayCounts,
                            backgroundColor: [
                                '#667eea', '#667eea', '#667eea', '#667eea', '#667eea', '#764ba2', '#764ba2'
                            ],
                            borderRadius: 8,
                            borderSkipped: false,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false,
                            },
                            tooltip: {
                                callbacks: {
                                    label: (ctx) => `${ctx.raw} задач(и)`
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 1,
                                    precision: 0
                                },
                                grid: {
                                    color: '#f0f0f0'
                                }
                            },
                            x: {
                                grid: {
                                    display: false
                                }
                            }
                        }
                    }
                });
            }

            // ====== РАСПРЕДЕЛЕНИЕ ПРИОРИТЕТОВ ======
            const priorityCounts = { HIGH: 0, MEDIUM: 0, LOW: 0 };
            entries.forEach(e => {
                const p = e.priority?.toUpperCase() || 'LOW';
                if (priorityCounts.hasOwnProperty(p)) priorityCounts[p]++;
            });

            const priorityBarsContainer = document.getElementById('priorityBars');
            const priorityFallback = document.getElementById('priorityFallback');

            if (totalTasks === 0) {
                priorityBarsContainer.style.display = 'none';
                priorityFallback.style.display = 'block';
            } else {
                priorityBarsContainer.style.display = 'flex';
                priorityFallback.style.display = 'none';

                const maxPriority = Math.max(priorityCounts.HIGH, priorityCounts.MEDIUM, priorityCounts.LOW, 1);
                const priorityList = [
                    { key: 'HIGH', label: 'Высокий', cls: 'high' },
                    { key: 'MEDIUM', label: 'Средний', cls: 'medium' },
                    { key: 'LOW', label: 'Низкий', cls: 'low' }
                ];

                priorityBarsContainer.innerHTML = priorityList.map(p => {
                    const count = priorityCounts[p.key];
                    const percent = Math.round((count / maxPriority) * 100);
                    return `
                        <div class="priority-bar-item">
                            <div class="priority-color ${p.cls}"></div>
                            <div class="priority-info">
                                <div class="priority-name">${p.label}</div>
                                <div class="priority-bar-bg">
                                    <div class="priority-bar-fill ${p.cls}" style="width: ${percent}%;"></div>
                                </div>
                            </div>
                            <div class="priority-count">${count} задач</div>
                        </div>
                    `;
                }).join('');
            }

            // ====== ТАБЛИЦА ПОСЛЕДНИХ ЗАПИСЕЙ ======
            const tableBody = document.getElementById('tableBody');
            const tableWrapper = document.getElementById('tableWrapper');
            const tableFallback = document.getElementById('tableFallback');

            // Сортируем по дате и времени (сначала новые)
            const sortedEntries = [...entries].sort((a, b) => {
                if (!a.date || !b.date) return 0;
                const dateComp = b.date.localeCompare(a.date);
                if (dateComp !== 0) return dateComp;
                return (b.startTime || '').localeCompare(a.startTime || '');
            });

            if (sortedEntries.length === 0) {
                tableWrapper.style.display = 'none';
                tableFallback.style.display = 'block';
            } else {
                tableWrapper.style.display = 'block';
                tableFallback.style.display = 'none';

                tableBody.innerHTML = sortedEntries.slice(0, 50).map(e => {
                    const duration = calcDuration(e);
                    const priority = e.priority?.toUpperCase() || 'LOW';
                    let badgeClass = 'badge-low';
                    let priorityLabel = 'Низкий';
                    if (priority === 'HIGH') { badgeClass = 'badge-high';
                        priorityLabel = 'Высокий'; } else if (priority === 'MEDIUM') { badgeClass = 'badge-medium';
                        priorityLabel = 'Средний'; }

                    return `
                        <tr>
                            <td>${e.date || '—'}</td>
                            <td>${e.startTime || '—'} – ${e.endTime || '—'}</td>
                            <td>${e.task || 'Без названия'}</td>
                            <td><span class="badge ${badgeClass}">${priorityLabel}</span></td>
                            <td>${formatDuration(duration)}</td>
                        </tr>
                    `;
                }).join('');
            }
        }

        // Установить текущий месяц по умолчанию
        function setDefaultMonth() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('monthFilter').value = `${year}-${month}`;
        }

        // Обработчик смены месяца
        document.getElementById('monthFilter').addEventListener('change', loadStats);

        // Глобальная функция для кнопки обновления
        window.loadStats = loadStats;

        // Инициализация
        setDefaultMonth();
        loadStats();
    })();
</script>
</body>
</html>
